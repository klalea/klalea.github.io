<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Corrected MIDI Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/@magenta/music@^1.23.1/dist/magentamusic.min.js"></script>
    <style>
        body { background: #121212; color: #eee; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #toolbar { background: #222; padding: 10px; display: flex; gap: 10px; border-bottom: 1px solid #333; }
        #editor-layout { display: flex; flex: 1; overflow: hidden; }
        #piano-roll { position: relative; flex: 1; overflow: auto; background: #1a1a1a; }
        canvas { display: block; cursor: crosshair; }
        #play-head { 
            position: absolute; top: 0; left: 0; width: 2px; height: 100%; 
            background: rgba(255, 0, 0, 0.6); pointer-events: none; display: none; 
        }
        button { background: #444; color: white; border: 1px solid #555; padding: 5px 15px; cursor: pointer; }
        button:hover { background: #555; }
    </style>
</head>
<body>

<div id="toolbar">
    <button id="playBtn">再生 / 停止</button>
    <button id="clearBtn">クリア</button>
    <button id="saveBtn">MIDI保存</button>
    <span id="info">左: 追加 | 右: 削除</span>
</div>

<div id="editor-layout">
    <div id="piano-roll">
        <canvas id="editorCanvas"></canvas>
        <div id="play-head"></div>
    </div>
</div>

<script>
    // 定義
    const STEP_W = 40;     // 16分音符の幅(px)
    const NOTE_H = 20;     // ノートの高さ(px)
    const PITCH_START = 84; // 最高音 (C5)
    const PITCH_END = 48;   // 最低音 (C2)
    const PITCH_COUNT = PITCH_START - PITCH_END + 1;
    const TOTAL_STEPS = 64; // 4小節分 (16*4)

    const canvas = document.getElementById('editorCanvas');
    const ctx = canvas.getContext('2d');
    const playHead = document.getElementById('play-head');
    const player = new mm.Player();
    
    let sequence = { notes: [], totalTime: 0 };

    canvas.width = TOTAL_STEPS * STEP_W;
    canvas.height = PITCH_COUNT * NOTE_H;

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. グリッドの描画 (背景)
        for (let s = 0; s <= TOTAL_STEPS; s++) {
            ctx.beginPath();
            ctx.lineWidth = (s % 4 === 0) ? 2 : 1;
            ctx.strokeStyle = (s % 16 === 0) ? "#555" : "#333";
            ctx.moveTo(s * STEP_W, 0);
            ctx.lineTo(s * STEP_W, canvas.height);
            ctx.stroke();
        }
        for (let p = 0; p <= PITCH_COUNT; p++) {
            const pitch = PITCH_START - p;
            const isBlackKey = [1,3,6,8,10].includes(pitch % 12);
            ctx.fillStyle = isBlackKey ? "#222" : "#2a2a2a";
            ctx.fillRect(0, p * NOTE_H, canvas.width, NOTE_H);
            
            ctx.beginPath();
            ctx.strokeStyle = "#111";
            ctx.moveTo(0, p * NOTE_H);
            ctx.lineTo(canvas.width, p * NOTE_H);
            ctx.stroke();
        }

        // 2. ノートの描画
        sequence.notes.forEach(note => {
            const x = note.quantizedStartStep * STEP_W;
            const y = (PITCH_START - note.pitch) * NOTE_H;
            
            ctx.fillStyle = "#00adb5";
            ctx.fillRect(x + 2, y + 2, STEP_W - 4, NOTE_H - 4);
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 1;
            ctx.strokeRect(x + 2, y + 2, STEP_W - 4, NOTE_H - 4);
        });
    }

    // 編集イベント
    canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) + document.getElementById('piano-roll').scrollLeft;
        const y = (e.clientY - rect.top) + document.getElementById('piano-roll').scrollTop;

        const step = Math.floor(x / STEP_W);
        const pitch = PITCH_START - Math.floor(y / NOTE_H);

        if (e.button === 0) { // 追加
            if (!sequence.notes.some(n => n.pitch === pitch && n.quantizedStartStep === step)) {
                sequence.notes.push({ pitch, quantizedStartStep: step, quantizedEndStep: step + 1 });
            }
        } else if (e.button === 2) { // 削除
            sequence.notes = sequence.notes.filter(n => !(n.pitch === pitch && n.quantizedStartStep === step));
        }
        draw();
    });

    canvas.oncontextmenu = (e) => e.preventDefault();

    // 再生
    document.getElementById('playBtn').onclick = () => {
        if (player.isPlaying()) {
            player.stop();
            playHead.style.display = "none";
        } else {
            if (sequence.notes.length === 0) return;
            const qns = mm.sequences.unquantizeNoteSequence(
                Object.assign({ quantizationInfo: { stepsPerQuarter: 4 }, totalQuantizedSteps: TOTAL_STEPS }, sequence)
            );
            
            playHead.style.display = "block";
            player.start(qns).then(() => playHead.style.display = "none");

            const anim = () => {
                if (player.isPlaying()) {
                    const currentStep = player.getPlayState().ticks / (player.context.transport.PPQ / 4);
                    playHead.style.left = (currentStep * STEP_W) + "px";
                    requestAnimationFrame(anim);
                }
            };
            anim();
        }
    };

    document.getElementById('clearBtn').onclick = () => { sequence.notes = []; draw(); };
    document.getElementById('saveBtn').onclick = () => {
        const midi = mm.sequenceProtoToMidi(mm.sequences.unquantizeNoteSequence(
            Object.assign({ quantizationInfo: { stepsPerQuarter: 4 } }, sequence)
        ));
        const blob = new Blob([midi], { type: 'audio/midi' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'composition.mid';
        a.click();
    };

    draw();
</script>
</body>
</html>
