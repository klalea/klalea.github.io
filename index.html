<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Advanced Magenta MIDI Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/@magenta/music@^1.23.1/dist/magentamusic.min.js"></script>
    <style>
        :root { --bg: #1e1e1e; --panel: #2d2d2d; --accent: #007acc; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* ツールバー */
        #toolbar { background: var(--panel); padding: 10px 20px; display: flex; gap: 15px; align-items: center; border-bottom: 1px solid #444; }
        button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; background: #444; color: white; transition: 0.2s; }
        button.primary { background: var(--accent); }
        button:hover { background: #555; }
        button:active { transform: translateY(1px); }

        /* エディタエリア */
        #editor-container { position: relative; flex-grow: 1; overflow: auto; display: flex; }
        #piano-keys { width: 60px; background: #333; flex-shrink: 0; position: sticky; left: 0; z-index: 10; }
        .key { height: 19px; border-bottom: 1px solid #111; font-size: 9px; display: flex; align-items: center; justify-content: flex-end; padding-right: 5px; color: #888; }
        .black { background: #1a1a1a; }

        /* キャンバス */
        #canvas-wrapper { position: relative; }
        canvas { display: block; background-image: 
            linear-gradient(90deg, #333 1px, transparent 1px),
            linear-gradient(#333 1px, transparent 1px);
            background-size: 40px 20px; /* グリッドサイズ */
        }
        #play-head { position: absolute; top: 0; left: 0; width: 2px; height: 100%; background: #ff4d4d; pointer-events: none; visibility: hidden; }
        
        .hint { font-size: 12px; color: #aaa; margin-left: auto; }
    </style>
</head>
<body>

<div id="toolbar">
    <button id="playBtn" class="primary">再生 / 停止</button>
    <button id="clearBtn">全消去</button>
    <button id="saveBtn">MIDI保存</button>
    <span id="status">Ready</span>
    <span class="hint">左クリック: 追加 | 右クリック: 削除</span>
</div>

<div id="editor-container">
    <div id="piano-keys"></div>
    <div id="canvas-wrapper">
        <canvas id="canvas"></canvas>
        <div id="play-head"></div>
    </div>
</div>

<script>
    // --- 定数と設定 ---
    const PITCH_CNT = 88;
    const MIN_PITCH = 21;
    const NOTE_HEIGHT = 20;
    const PIXELS_PER_STEP = 40; // 16分音符 1つ分
    const STEPS_PER_QUARTER = 4;
    
    let sequence = { notes: [], totalTime: 0 };
    const canvas = document.getElementById('canvas');
    const playHead = document.getElementById('play-head');
    const ctx = canvas.getContext('2d');
    const player = new mm.Player();

    // --- 初期化 ---
    function init() {
        canvas.height = PITCH_CNT * NOTE_HEIGHT;
        canvas.width = 3200; // 長めのキャンバス
        
        // 鍵盤の描画
        const keysDiv = document.getElementById('piano-keys');
        for (let i = 0; i < PITCH_CNT; i++) {
            const pitch = (MIN_PITCH + PITCH_CNT - 1) - i;
            const key = document.createElement('div');
            key.className = `key ${[1,3,6,8,10].includes(pitch % 12) ? 'black' : ''}`;
            key.innerHTML = pitch % 12 === 0 ? `C${Math.floor(pitch/12) - 1}` : '';
            key.style.height = (NOTE_HEIGHT - 1) + 'px';
            keysDiv.appendChild(key);
        }
        render();
    }

    // --- 描画ロジック ---
    function render() {
        // 背景とグリッドはCSSで処理しているため、ノートのみ描画
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        sequence.notes.forEach(note => {
            const x = note.quantizedStartStep * PIXELS_PER_STEP;
            const y = (PITCH_CNT - 1 - (note.pitch - MIN_PITCH)) * NOTE_HEIGHT;
            
            ctx.fillStyle = '#4da6ff';
            ctx.fillRect(x + 1, y + 1, (note.quantizedEndStep - note.quantizedStartStep) * PIXELS_PER_STEP - 2, NOTE_HEIGHT - 2);
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(x + 1, y + 1, (note.quantizedEndStep - note.quantizedStartStep) * PIXELS_PER_STEP - 2, NOTE_HEIGHT - 2);
        });
    }

    // --- 編集ロジック ---
    canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const step = Math.floor(x / PIXELS_PER_STEP);
        const pitch = (MIN_PITCH + PITCH_CNT - 1) - Math.floor(y / NOTE_HEIGHT);

        if (e.button === 0) { // 左クリック: 追加
            // 重複チェック
            if (!sequence.notes.some(n => n.pitch === pitch && n.quantizedStartStep === step)) {
                sequence.notes.push({
                    pitch: pitch,
                    quantizedStartStep: step,
                    quantizedEndStep: step + 1,
                    program: 0
                });
            }
        } else if (e.button === 2) { // 右クリック: 削除
            sequence.notes = sequence.notes.filter(n => 
                !(n.pitch === pitch && n.quantizedStartStep <= step && n.quantizedEndStep > step)
            );
        }
        
        sequence.totalTime = Math.max(...sequence.notes.map(n => n.quantizedEndStep), 0) * 0.25;
        render();
    });

    // 右クリックメニュー禁止
    canvas.oncontextmenu = (e) => e.preventDefault();

    // --- 再生ロジック ---
    document.getElementById('playBtn').addEventListener('click', async () => {
        if (player.isPlaying()) {
            player.stop();
            playHead.style.visibility = 'hidden';
        } else {
            if (sequence.notes.length === 0) return;
            
            // Magenta用に量子化済みデータを準備
            const qns = mm.sequences.unquantizeNoteSequence(
                Object.assign({ quantizationInfo: { stepsPerQuarter: 4 } }, sequence)
            );

            playHead.style.visibility = 'visible';
            player.start(qns, undefined).then(() => {
                playHead.style.visibility = 'hidden';
            });

            // 再生ヘッドの更新アニメーション
            const updateHead = () => {
                if (player.isPlaying()) {
                    const currentStep = player.getPlayState().ticks / (player.context.transport.PPQ / 4);
                    playHead.style.left = (currentStep * PIXELS_PER_STEP) + 'px';
                    requestAnimationFrame(updateHead);
                }
            };
            updateHead();
        }
    });

    document.getElementById('clearBtn').onclick = () => { sequence.notes = []; render(); };
    document.getElementById('saveBtn').onclick = () => {
        const midi = mm.sequenceProtoToMidi(mm.sequences.unquantizeNoteSequence(
            Object.assign({ quantizationInfo: { stepsPerQuarter: 4 } }, sequence)
        ));
        const blob = new Blob([midi], { type: 'audio/midi' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'editor_output.mid';
        a.click();
    };

    init();
</script>
</body>
</html>
